[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schedule"
version = "0.1.0"
description = "MILP scheduling console for diesel microgrids"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "numpy>=1.26",
  "pyomo>=6.7",
  "scipy>=1.12",
  "highspy>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["common*", "weekly_plan*", "daily_plan*", "hourly_plan*", "api*"]
