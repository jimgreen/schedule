<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,"><title>小时前滚动 · 输入曲线 · Schedule</title><link rel="stylesheet" href="/static/styles.css?v=20261118-pages"></head>
<body data-kind="hourly" data-feature="inputs"><div id="app">
<header><div><small>SCHEDULE / MILP</small><h1>电力优化调度平台</h1></div><span id="connection" role="status" aria-live="polite">连接中…</span></header>
<nav id="modules" aria-label="调度模块"><a href="/" class="home-link">首页</a><a href="/weekly_plan/inputs.html">周前计划</a><a href="/daily_plan/inputs.html">日前计划</a><a href="/hourly_plan/inputs.html" aria-current="page">小时前滚动</a><a href="/shared/devices.html">共享设备参数</a><a href="/shared/network.html">共享电网模型</a></nav>
<main><section class="view" id="module-view"><div class="heading"><div><h2>小时前滚动 · 输入曲线</h2><small>16 × 15 分钟 · 4 小时</small></div><span id="dirty" class="badge"></span><button id="solve">计算本模块 MILP</button></div><nav id="functions" aria-label="模块功能"><a href="/hourly_plan/optimization.html">优化参数</a><a href="/hourly_plan/inputs.html" aria-current="page">输入曲线</a><a href="/hourly_plan/results.html">输出结果</a><a href="/hourly_plan/control.html">控制审计</a></nav><div id="module-tools" class="toolbar"><button id="save-module">保存输入曲线</button><button id="export-module">导出输入曲线</button><label class="file-button">导入输入曲线<input id="import-module" type="file" accept=".json,application/json"></label></div><div id="draft-tools" class="toolbar notice" hidden><span>服务器数据已变化，本地草稿暂未加载。</span><button id="export-local-draft">导出本地草稿</button><button id="discard-local-draft">清除本地草稿</button></div><div id="inputs" class="feature panel">
        <div class="toolbar"><label>曲线<select id="curve-kind"><option value="demand_kw">负荷 (kW)</option><option value="wind_kw">风电 (kW)</option><option value="pv_kw">光伏 (kW)</option></select></label><label>功能<select id="input-mode"><option value="edit">逐点编辑</option><option value="batch">批量调整</option><option value="template">曲线模板</option><option value="settings">时间与备用</option></select></label></div>
        <div id="input-edit" class="subview"><div id="input-chart" class="chart"></div><div id="input-curve-form" class="form-grid"></div><div class="pager"><label>跳至时段<input id="curve-jump" type="number" min="1" value="1"></label><button data-page="curve:-1">上一页</button><span id="curve-page"></span><button data-page="curve:1">下一页</button></div></div>
        <div id="input-batch" class="subview" hidden><div class="form-grid"><label>起始时段<input id="curve-from" type="number" min="1" value="1"></label><label>结束时段<input id="curve-to" type="number" min="1"></label><label>批量比例<input id="curve-scale" type="number" min="0" value="1" step="0.01"></label><label>批量偏移 (kW)<input id="curve-offset" type="number" value="0" step="1"></label></div><p class="notice">新值 = 原值 × 比例 + 偏移。设比例为 0 可填充固定值；负值会被拒绝。仅修改当前模块、当前曲线的草稿，保存后才参与计算。</p><div class="toolbar"><button data-curve-action="apply">应用批量调整</button><button data-curve-action="undo" disabled>撤销批量调整</button></div><div id="batch-status" class="notice" role="status"></div></div>
        <div id="input-template" class="subview" hidden><div class="form-grid"><label>模板<select id="curve-template"><option value="flat">平坦（平均值）</option><option value="peak_valley">峰谷（先升后降）</option><option value="interpolate">首尾线性插值</option><option value="copy_parent">复制上级模块</option></select></label><label>模板比例<input id="template-scale" type="number" min="0" value="1" step="0.01"></label></div><p class="notice">模板只修改当前曲线草稿。复制上级模块按起点对齐与步长插值，需上级覆盖整个时段；使用上级已保存曲线。</p><div class="toolbar"><button data-curve-action="template">应用曲线模板</button><button data-curve-action="undo" disabled>撤销模板</button><button data-curve-action="restore">恢复保存值</button></div><div id="template-status" class="notice" role="status"></div></div>
        <div id="input-settings" class="subview" hidden><div class="form-grid"><label>备用比例<input id="reserve-fraction" type="number" min="0" max="1" step="0.01"></label><label>起点 (本地时间；可留空)<input id="start-time" type="datetime-local"></label></div></div>
      </div></section></main>
<footer><span id="db-path">SQLite</span><span id="toast" role="status">正在加载…</span></footer>
</div><script src="/static/result-data.js?v=20261118-pages" defer></script><script type="module" src="/static/pages/inputs.js?v=20261118-pages"></script></body></html>
